<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>229Voitures — Dislikes</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --surface: #0a0a0a;
      --surface2: #141414;
      --accent: #FFD700;
      --text: #e8e8e8;
      --text-muted: #666666;
      --border: #222222;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      padding: 32px 24px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--accent);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 28px;
    }

    .token-form {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
    }

    .token-form input {
      flex: 1;
      max-width: 360px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      padding: 10px 14px;
      outline: none;
    }

    .token-form input:focus { border-color: var(--accent); }

    .token-form button {
      background: var(--accent);
      color: #1a1a1a;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 20px;
      cursor: pointer;
    }

    .token-form button:hover { background: #f0b84d; }

    #status {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    #status.error { color: var(--danger); }

    .stats-bar {
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
    }

    .stat-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .stat-chip strong { color: var(--accent); font-size: 18px; display: block; }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead th {
      background: var(--surface2);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }

    td {
      padding: 12px 16px;
      vertical-align: top;
      color: var(--text);
      max-width: 340px;
    }

    td.nowrap { white-space: nowrap; color: var(--text-muted); font-size: 12px; }
    td.intent { white-space: nowrap; }

    .intent-badge {
      display: inline-block;
      background: rgba(255,215,0,0.10);
      color: var(--accent);
      border: 1px solid rgba(255,215,0,0.25);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
    }

    .truncate {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }

    #results { display: none; }
  </style>
</head>
<body>

<h1>&#128030; Dislikes utilisateurs</h1>
<p class="subtitle">Réponses signalées comme mauvaises (bad_responses)</p>

<div class="token-form">
  <input type="password" id="tokenInput" placeholder="ADMIN_TOKEN" />
  <button onclick="loadBugs()">Charger</button>
</div>

<div id="status">Entrez le token admin pour afficher les données.</div>

<div id="results">
  <div class="stats-bar">
    <div class="stat-chip"><strong id="countTotal">—</strong>Total</div>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Date</th>
          <th>Intent</th>
          <th>Question</th>
          <th>Réponse IA</th>
          <th>Utilisateur</th>
        </tr>
      </thead>
      <tbody id="bugsBody"></tbody>
    </table>
  </div>
</div>

<script>
  async function loadBugs() {
    const token = document.getElementById('tokenInput').value.trim();
    const status = document.getElementById('status');
    if (!token) { status.textContent = 'Token requis.'; status.className = 'error'; return; }

    status.textContent = 'Chargement...';
    status.className = '';

    try {
      const res = await fetch('/admin/bugs', {
        headers: { 'Authorization': 'Bearer ' + token }
      });

      if (res.status === 401) {
        status.textContent = 'Token invalide.';
        status.className = 'error';
        return;
      }

      const data = await res.json();
      render(data);
    } catch (e) {
      status.textContent = 'Erreur réseau: ' + e.message;
      status.className = 'error';
    }
  }

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function fmtDate(s) {
    if (!s) return '—';
    return s.replace('T', ' ').slice(0, 16);
  }

  function render(data) {
    document.getElementById('countTotal').textContent = data.total;
    const tbody = document.getElementById('bugsBody');
    tbody.innerHTML = '';

    if (!data.bugs || data.bugs.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:32px;">Aucun dislike enregistré.</td></tr>';
    } else {
      data.bugs.forEach((b, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="nowrap">${b.id}</td>
          <td class="nowrap">${escHtml(fmtDate(b.created_at))}</td>
          <td class="intent"><span class="intent-badge">${escHtml(b.intent || '?')}</span></td>
          <td><div class="truncate">${escHtml(b.question)}</div></td>
          <td><div class="truncate">${escHtml(b.response)}</div></td>
          <td class="nowrap">${escHtml(b.user_id || '—')}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById('status').textContent = `${data.total} résultat(s) chargé(s).`;
    document.getElementById('results').style.display = 'block';
  }

  document.getElementById('tokenInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') loadBugs();
  });
</script>

</body>
</html>
